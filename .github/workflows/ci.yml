name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: format, lint, docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/check-notices
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Tests (unit, Graph against a mock server, headless UI)
        run: cargo test --locked --workspace --all-targets
      - name: macOS window smoke test
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          CODESIGN_IDENTITY: '-'
        run: |
          cargo build --locked --release
          packaging/macos/bundle.sh target/release/chaat "$RUNNER_TEMP/Chaat.app" 0.1.0
          open -W -n --stdout "$RUNNER_TEMP/startup.txt" "$RUNNER_TEMP/Chaat.app" --args --measure-startup
          grep -q "first frame after" "$RUNNER_TEMP/startup.txt"

  signing:
    name: macOS signing identity regression
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - run: packaging/macos/test-signing.sh

  package:
    name: package (${{ matrix.name }})
    # Builds installable artifacts on main; nothing is published as a release.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [quality, test, signing]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Check notices in the standalone binary
        shell: bash
        run: |
          target/release/chaat --licenses > "$RUNNER_TEMP/chaat-licenses.txt"
          grep -q 'licenses/fonts/Hack-Regular.txt' "$RUNNER_TEMP/chaat-licenses.txt"
          grep -q 'Microsoft Corporation' "$RUNNER_TEMP/chaat-licenses.txt"
      - name: Package macOS app
        if: runner.os == 'macOS'
        # Disposable development artifact, not an update release.
        env:
          CODESIGN_IDENTITY: '-'
        run: |
          mkdir -p dist
          packaging/macos/bundle.sh target/release/chaat dist/Chaat.app "$(cargo pkgid | sed 's/.*[#@]//')"
          ditto -c -k --keepParent dist/Chaat.app dist/chaat-${{ matrix.name }}.zip
      - name: Build the relay (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release -p wren-relay
          target/release/chaat-relay --licenses > "$RUNNER_TEMP/relay-licenses.txt"
          cmp "$RUNNER_TEMP/chaat-licenses.txt" "$RUNNER_TEMP/relay-licenses.txt"
          mkdir -p dist/relay
          cp target/release/chaat-relay dist/relay/
          packaging/copy-notices.sh dist/relay
          tar -C dist/relay -czf dist/chaat-relay-${{ matrix.name }}.tar.gz .
      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/chaat
          cp target/release/chaat packaging/linux/chaat.desktop packaging/linux/chaat-256.png packaging/linux/install.sh packaging/icons/chaat.svg dist/chaat/
          packaging/copy-notices.sh dist/chaat
          tar -C dist -czf dist/chaat-${{ matrix.name }}.tar.gz chaat
      - name: Copy Windows notices
        if: runner.os == 'Windows'
        shell: bash
        run: packaging/copy-notices.sh dist/chaat
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/chaat | Out-Null
          Copy-Item target/release/chaat.exe dist/chaat/
          Compress-Archive -Path dist/chaat/* -DestinationPath dist/chaat-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: chaat-${{ matrix.name }}
          path: |
            dist/chaat-${{ matrix.name }}.*
            dist/chaat-relay-${{ matrix.name }}.*
          retention-days: 14
